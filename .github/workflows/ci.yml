# .github/workflows/ci.yml

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-and-parity:
    name: MLT 7.22 smoke + parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install Linux and MLT dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libepoxy-dev \
            libgtk-3-dev \
            libmlt-data \
            libmlt-dev \
            pkg-config

      - name: Verify MLT version
        shell: bash
        run: |
          set -euo pipefail
          expected_series='7.22'
          actual="$(pkg-config --modversion mlt-framework-7)"

          echo "Expected MLT series: ${expected_series}.x"
          echo "Installed MLT: $actual"

          if [[ "$actual" != "${expected_series}."* ]]; then
            echo "::error::CI is validated against MLT ${expected_series}.x, but the runner provides $actual."
            echo "::error::Before raising the baseline, run tools/pts_diag.sh on the candidate MLT version and reconsider promoting its audio-flush check to a zero-warning regression gate."
            exit 1
          fi

      - name: Prepare Flutter Linux artifacts
        run: |
          flutter config --enable-linux-desktop
          flutter precache --linux
          flutter pub get
          # A real Linux build is required on a clean runner to generate
          # linux/flutter/ephemeral, which tools/smoke.sh links against.
          flutter build linux --debug --no-pub

      - name: Analyze Dart
        run: flutter analyze

      - name: Run Dart regression tests
        run: flutter test

      - name: Run native smoke and preview/export parity
        shell: bash
        run: bash tools/smoke.sh